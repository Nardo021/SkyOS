[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/sky-core",
    "crates/aircraft-provider",
    "crates/airport-data",
    "crates/storage",
]

[workspace.package]
version = "1.0.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
